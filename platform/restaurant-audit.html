<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Master Audit · Академия счастья</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="crm.css" />
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="crm-store.js"></script>
  <style>
    :root{--ink:#1c1917;--muted:#78716c;--line:#e7e5e4;--bg:#f5f5f4;--good:#15803d;--mid:#b45309;--bad:#be123c}
    *{box-sizing:border-box}body{background:var(--bg);color:var(--ink)}.audit-shell{max-width:920px;margin:0 auto;padding:18px 14px calc(110px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top h1{font-size:clamp(1.5rem,7vw,2.1rem);margin:0;letter-spacing:-.04em}.top p{margin:4px 0 0;color:var(--muted);font-size:.82rem}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(28,25,23,.05);margin-bottom:12px}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:.84rem}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:84px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btnx{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.btnx.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btnx.good{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.btnx:disabled{opacity:.45;cursor:not-allowed}.progress-wrap{position:sticky;top:0;z-index:8;background:rgba(245,245,244,.96);backdrop-filter:blur(14px);margin:0 -14px 10px;padding:10px 14px 9px;border-bottom:1px solid rgba(231,229,228,.8)}.progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;font-weight:800;margin-bottom:7px}.progress{height:7px;background:#e7e5e4;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--ink)}.question-head{display:flex;justify-content:space-between;gap:10px}.code{font-size:.75rem;color:var(--muted);font-weight:800}.critical{font-size:.7rem;font-weight:800;color:#9f1239;background:#fff1f2;border-radius:999px;padding:5px 8px}.question{font-size:clamp(1.15rem,5vw,1.55rem);line-height:1.25;font-weight:800;letter-spacing:-.025em;margin:12px 0 9px}.evidence{background:#fafaf9;border-radius:12px;padding:10px 12px;color:#57534e;font-size:.84rem}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.score{border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:#fff;font:inherit;font-weight:800;cursor:pointer}.score small{display:block;font-size:.62rem;color:var(--muted);margin-top:3px}.score.on[data-score="0"]{background:#fff1f2;border-color:#fda4af;color:#9f1239}.score.on[data-score="1"]{background:#fffbeb;border-color:#fcd34d;color:#92400e}.score.on[data-score="2"]{background:#ecfdf5;border-color:#86efac;color:#166534}.score.on[data-na="1"]{background:#f5f5f4;border-color:#a8a29e}.nav{display:flex;gap:8px}.nav .btnx{flex:1}.session{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:11px 0}.session:first-child{border-top:0}.scorebig{font-size:1.25rem;font-weight:800}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px}.metric .k{font-size:.72rem;color:var(--muted);font-weight:800}.metric .v{font-size:1.55rem;font-weight:800;margin-top:3px}.blockrow{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.86rem}.saved{font-size:.78rem;color:var(--good);min-height:1.2em}.saved.offline{color:var(--mid)}
    @media(max-width:650px){.grid,.summary-grid{grid-template-columns:1fr}.scores{grid-template-columns:1fr 1fr}.hide-mobile{display:none!important}}
  </style>
</head>
<body class="crm-page">
  <header class="no-print"><div class="wrap header-inner"><a class="logo" href="/">Академия<span>счастья</span></a><ul class="nav-links"><li><a href="index.html">Платформа</a></li><li><a href="crm.html">CRM</a></li><li><a href="restaurant-audit.html" class="is-on">Master Audit</a></li></ul><button class="header-cta" type="button" id="logoutBtn" hidden>Выйти</button></div></header>
  <div class="gate" id="gate"><div class="gate-card"><h1>Master Audit</h1><p>Вход для консультантов Академии.</p><p class="err" id="gateErr"></p><form id="gateForm"><div class="field"><label for="username">Логин</label><input id="username" autocomplete="username" required /></div><div class="field"><label for="pwd">Пароль</label><input id="pwd" type="password" autocomplete="current-password" required /></div><label class="field"><input id="remember" type="checkbox" checked /> Запомнить на 30 дней</label><button class="btn btn-primary" type="submit" style="width:100%">Войти</button></form></div></div>
  <main id="app" hidden><div class="audit-shell"><div class="top"><div><h1>Master Audit</h1><p>AH Restaurant Operating System · 150 стандартов · Day 0 → Day 60</p></div><a class="btnx hide-mobile" href="crm.html">CRM</a></div><div id="homeView"></div><div id="auditView" class="hidden"></div><div id="summaryView" class="hidden"></div></div></main>
<script>
(function(){
  var RAW="https://raw.githubusercontent.com/mrsergeyesmirnov-svg/-1/main/docs/akademiya-schastya/platform/data/";
  var CSV=[RAW+"master-audit-01.csv",RAW+"master-audit-02.csv",RAW+"master-audit-03.csv"];
  var template=[],current=null,answers={},position=0,history=[];
  var PENDING_KEY="ah_master_audit_pending_v2";
  function el(id){return document.getElementById(id)}
  function esc(s){return String(s==null?"":s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function api(path,opts){return PlatformAuth.request(path,opts||{})}
  function parseCSV(text){var rows=[],row=[],cell="",quoted=false;for(var i=0;i<text.length;i++){var c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=""}else if(c==='\n'){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}var head=rows.shift()||[];return rows.filter(function(r){return r.length&&r[0]}).map(function(r){var o={};head.forEach(function(h,j){o[h]=r[j]==null?"":r[j]});return o})}
  function loadTemplate(){if(template.length)return Promise.resolve();return Promise.all(CSV.map(function(url){return fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("Не удалось загрузить методику аудита");return r.text()})})).then(function(parts){template=[].concat.apply([],parts.map(parseCSV)).map(function(x){return{id:+x.id,code:x.code,section:x.section,weight:+x.weight,critical:x.critical==="ДА",standard:x.standard,evidence:x.evidence}}).sort(function(a,b){return a.id-b.id});if(template.length!==150)throw new Error("В методике "+template.length+" пунктов вместо 150")})}
  function label(t){return {day0:"Day 0",day30:"Day 30",day60:"Day 60",extra:"Внеплановый"}[t]||t}
  function fmt(v){if(!v)return"";return new Date(v).toLocaleString("ru-RU",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}
  function showApp(){el("gate").hidden=true;el("app").hidden=false;el("logoutBtn").hidden=false;loadTemplate().then(function(){if(window.SSCrm&&SSCrm.syncFromServer)return SSCrm.syncFromServer()}).then(flushPending).then(renderHome).catch(function(e){alert(e.message)})}
  PlatformAuth.init(showApp);
  function clients(){try{return window.SSCrm?SSCrm.listClients():[]}catch(_){return[]}}
  function renderHome(){el("auditView").classList.add("hidden");el("summaryView").classList.add("hidden");el("homeView").classList.remove("hidden");var opts=clients().map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name||"Без названия")+'</option>'}).join("");el("homeView").innerHTML='<div class="card"><h2>Новый аудит</h2><p class="muted">С телефона: 0 / 1 / 2 / N/A. Каждый ответ сразу уходит в Railway Postgres.</p><div class="grid"><div class="field"><label>Ресторан из CRM</label><select id="clientSel"><option value="">— выбрать / вручную —</option>'+opts+'</select></div><div class="field"><label>Контрольная точка</label><select id="auditType"><option value="day0">Day 0 · точка отсчёта</option><option value="day30">Day 30 · контроль</option><option value="day60">Day 60 · итог</option><option value="extra">Внеплановый</option></select></div></div><div class="field" style="margin-top:10px"><label>Название вручную</label><input id="manualRestaurant" placeholder="Например, MOJO · Невский" /></div><div class="actions"><button class="btnx primary" id="startBtn">Начать аудит</button><button class="btnx" id="refreshBtn">Обновить</button></div></div><div class="card"><h2>История аудитов</h2><div id="historyBox" class="muted">Загрузка…</div></div>';el("startBtn").onclick=startAudit;el("refreshBtn").onclick=loadHistory;loadHistory()}
  function loadHistory(){var box=el("historyBox");return api("/api/audits?limit=100").then(function(d){history=d.audits||[];if(!history.length){box.innerHTML="Пока нет аудитов.";return}box.innerHTML=history.map(function(a){return '<div class="session"><div><b>'+esc(a.restaurant_title)+'</b><div class="muted">'+label(a.audit_type)+' · '+fmt(a.started_at)+' · '+(a.status==="completed"?"завершён":"черновик")+'</div></div><div style="display:flex;gap:8px;align-items:center"><span class="scorebig">'+(a.overall_score==null?"—":a.overall_score)+'</span><button class="btnx" data-open="'+esc(a.id)+'">'+(a.status==="completed"?"Отчёт":"Продолжить")+'</button></div></div>'}).join("");box.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){openAudit(b.getAttribute("data-open"))}})}).catch(function(e){box.innerHTML='<span style="color:#9f1239">'+esc(e.message)+'</span>'})}
  function startAudit(){var list=clients(),cid=el("clientSel").value,c=list.find(function(x){return x.id===cid}),manual=el("manualRestaurant").value.trim(),title=c?(c.name||"Без названия"):manual;if(!title){alert("Выберите ресторан или введите название");return}api("/api/audits",{method:"POST",body:JSON.stringify({client_id:c?c.id:null,restaurant_title:title,audit_type:el("auditType").value,template_version:"AH-AUDIT-1.0"})}).then(function(d){return openAudit(d.audit.id)}).catch(function(e){alert(e.message)})}
  function openAudit(id){return api("/api/audits/"+encodeURIComponent(id)).then(function(d){current=d.audit;answers={};(d.answers||[]).forEach(function(a){answers[a.item_id]=a});position=0;var first=template.findIndex(function(it){var a=answers[it.id];return !a||(!a.is_na&&a.score==null)});if(first>=0)position=first;if(current.status==="completed"){renderSummary(d);return}el("homeView").classList.add("hidden");el("summaryView").classList.add("hidden");el("auditView").classList.remove("hidden");renderQuestion()}).catch(function(e){alert(e.message)})}
  function answeredCount(){return template.filter(function(it){var a=answers[it.id];return a&&(a.is_na||a.score===0||a.score===1||a.score===2)}).length}
  function renderQuestion(){var it=template[position],a=answers[it.id]||{},done=answeredCount(),pct=Math.round(done/150*100);el("auditView").innerHTML='<div class="progress-wrap"><div class="progress-meta"><span>'+esc(current.restaurant_title)+' · '+label(current.audit_type)+'</span><span>'+done+'/150</span></div><div class="progress"><div style="width:'+pct+'%"></div></div></div><div class="card"><div class="question-head"><div class="code">'+esc(it.code)+' · '+esc(it.section)+'</div>'+(it.critical?'<span class="critical">КРИТИЧНЫЙ</span>':"")+'</div><div class="question">'+esc(it.standard)+'</div><div class="evidence"><b>Как проверить:</b> '+esc(it.evidence)+'</div><div class="scores"><button class="score '+(a.score===0&&!a.is_na?"on":"")+'" data-score="0">0<small>нет системы</small></button><button class="score '+(a.score===1&&!a.is_na?"on":"")+'" data-score="1">1<small>частично</small></button><button class="score '+(a.score===2&&!a.is_na?"on":"")+'" data-score="2">2<small>работает</small></button><button class="score '+(a.is_na?"on":"")+'" data-na="1">N/A<small>не применимо</small></button></div><div class="field"><label>Комментарий / evidence</label><textarea id="comment" placeholder="Можно надиктовать голосовой клавиатурой iPhone…">'+esc(a.comment||"")+'</textarea></div><div id="saveState" class="saved"></div><div class="nav"><button class="btnx" id="prevBtn" '+(position===0?"disabled":"")+'>← Назад</button><button class="btnx" id="nextBtn">'+(position===149?"К итогу":"Дальше →")+'</button></div></div><div class="actions"><button class="btnx" id="homeBtn">← История</button><button class="btnx primary" id="finishBtn" '+(done<150?"disabled":"")+'>Завершить аудит</button></div>';document.querySelectorAll(".score").forEach(function(b){b.onclick=function(){var na=b.getAttribute("data-na")==="1",score=na?null:+b.getAttribute("data-score");saveAnswer(it,score,na,el("comment").value).then(function(){if(position<149){position++;renderQuestion()}else renderQuestion()})}});el("comment").onblur=function(){var cur=answers[it.id];if(cur&&(cur.is_na||cur.score!=null))saveAnswer(it,cur.score,cur.is_na,el("comment").value)};el("prevBtn").onclick=function(){if(position>0){position--;renderQuestion()}};el("nextBtn").onclick=function(){if(position<149){position++;renderQuestion()}else if(answeredCount()===150)finishAudit();else alert("Заполните все 150 пунктов или отметьте N/A")};el("homeBtn").onclick=renderHome;el("finishBtn").onclick=finishAudit}
  function pending(){try{return JSON.parse(localStorage.getItem(PENDING_KEY)||"[]")}catch(_){return[]}}function setPending(v){localStorage.setItem(PENDING_KEY,JSON.stringify(v))}
  function payload(it,score,isNa,comment){return{item_code:it.code,section:it.section,weight:it.weight,critical:it.critical,standard:it.standard,evidence_hint:it.evidence,score:score,is_na:isNa,comment:comment||""}}
  function saveAnswer(it,score,isNa,comment){var p=payload(it,score,isNa,comment),st=el("saveState");answers[it.id]=Object.assign({item_id:it.id},p);if(st)st.textContent="сохраняем…";return api("/api/audits/"+current.id+"/answers/"+it.id,{method:"PUT",body:JSON.stringify(p)}).then(function(){if(st){st.className="saved";st.textContent="✓ сохранено в Postgres"}}).catch(function(){var q=pending().filter(function(x){return !(x.audit_id===current.id&&x.item_id===it.id)});q.push({audit_id:current.id,item_id:it.id,payload:p});setPending(q);if(st){st.className="saved offline";st.textContent="офлайн: ответ сохранён на телефоне и будет дослан"}})}
  function flushPending(){var q=pending();if(!q.length)return Promise.resolve();var left=[];return q.reduce(function(chain,x){return chain.then(function(){return api("/api/audits/"+x.audit_id+"/answers/"+x.item_id,{method:"PUT",body:JSON.stringify(x.payload)}).catch(function(){left.push(x)})})},Promise.resolve()).then(function(){setPending(left)})}
  function finishAudit(){if(answeredCount()<150){alert("Заполните все 150 пунктов");return}flushPending().then(function(){return api("/api/audits/"+current.id+"/complete",{method:"POST"})}).then(function(){return api("/api/audits/"+current.id)}).then(renderSummary).catch(function(e){alert(e.message)})}
  function renderSummary(d){current=d.audit;answers={};(d.answers||[]).forEach(function(a){answers[a.item_id]=a});el("homeView").classList.add("hidden");el("auditView").classList.add("hidden");el("summaryView").classList.remove("hidden");var blocks=current.block_scores||{},prev=history.filter(function(a){return a.client_id===current.client_id&&a.status==="completed"&&a.id!==current.id&&a.overall_score!=null&&new Date(a.started_at)<new Date(current.started_at)}).sort(function(a,b){return new Date(b.started_at)-new Date(a.started_at)})[0],delta=prev?Math.round((current.overall_score-prev.overall_score)*10)/10:null;el("summaryView").innerHTML='<div class="card"><p class="muted" style="margin-top:0">'+esc(current.restaurant_title)+' · '+label(current.audit_type)+'</p><h2>Результат аудита</h2><div class="summary-grid"><div class="metric"><div class="k">Общий индекс</div><div class="v">'+(current.overall_score==null?"—":current.overall_score)+'</div></div><div class="metric"><div class="k">Red Flags</div><div class="v">'+current.red_flags_count+'</div></div><div class="metric"><div class="k">Изменение</div><div class="v">'+(delta==null?"—":(delta>0?"+":"")+delta)+'</div></div></div>'+(prev?'<p class="muted">Предыдущий аудит: '+prev.overall_score+' · '+label(prev.audit_type)+' · '+fmt(prev.started_at)+'</p>':"")+'</div><div class="card"><h3>По блокам</h3>'+Object.keys(blocks).map(function(k){return '<div class="blockrow"><span>'+esc(k)+'</span><b>'+blocks[k]+'</b></div>'}).join("")+'</div><div class="actions"><button class="btnx primary" id="pdfBtn">Скачать PDF</button><button class="btnx" id="exportBtn">Скачать Excel</button><button class="btnx" id="crmBtn">Записать итог в CRM</button>'+(current.audit_type==="day60"?'<button class="btnx good" id="baselineBtn">Healthy Baseline</button>':"")+'<button class="btnx" id="backBtn">← История</button></div><div id="sumMsg" class="saved" role="status" aria-live="polite"></div>';el("pdfBtn").onclick=function(){downloadReport("pdf")};el("exportBtn").onclick=function(){downloadReport("xlsx")};el("crmBtn").onclick=writeCRM;el("backBtn").onclick=renderHome;var bb=el("baselineBtn");if(bb)bb.onclick=function(){api("/api/audits/"+current.id+"/baseline",{method:"POST"}).then(function(){el("sumMsg").textContent="✓ Healthy Baseline сохранён в Postgres"}).catch(function(e){alert(e.message)})}}
  function writeCRM(){if(!current.client_id||!window.SSCrm)return alert("Аудит не привязан к карточке CRM");var c=SSCrm.getClient(current.client_id);if(!c)return alert("Обновите CRM и попробуйте снова");var text=label(current.audit_type)+" Master Audit: "+current.overall_score+"/100 · Red Flags: "+current.red_flags_count+" · "+new Date().toLocaleDateString("ru-RU");SSCrm.addComment(current.client_id,text);if(current.audit_type==="day0")SSCrm.upsertClient({id:current.client_id,status:"diagnose"});else if(current.audit_type==="day30"||current.audit_type==="day60")SSCrm.upsertClient({id:current.client_id,status:"change"});el("sumMsg").textContent="✓ итог записан в CRM"}
  function downloadReport(format){
    var audit=current,button=el(format==="pdf"?"pdfBtn":"exportBtn"),message=el("sumMsg");
    button.disabled=true;button.setAttribute("aria-busy","true");
    message.textContent="Готовим "+(format==="pdf"?"PDF":"Excel")+"…";
    var base=String(window.PLATFORM_API_URL||"").replace(/\/$/,"");
    fetch(base+"/api/audits/"+encodeURIComponent(audit.id)+"/export/"+format,{
      credentials:"include",headers:{"Accept":format==="pdf"?"application/pdf":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}
    }).then(function(response){
      if(!response.ok)return response.json().catch(function(){return {}}).then(function(data){
        throw new Error(response.status===401?"Сессия истекла. Войдите в аккаунт заново.":(data.detail||"Не удалось скачать отчёт"));
      });
      return response.blob();
    }).then(function(blob){
      var url=URL.createObjectURL(blob),link=document.createElement("a");
      var safe=audit.restaurant_title.replace(/[^a-zа-яё0-9_-]+/gi,"_").slice(0,50)||"Restaurant";
      link.href=url;link.download=safe+"_"+audit.audit_type+"."+format;
      document.body.appendChild(link);link.click();link.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},60000);
      message.textContent="✓ Файл готов. Проверьте загрузки браузера.";
    }).catch(function(error){message.textContent=error.message}).finally(function(){
      button.disabled=false;button.removeAttribute("aria-busy");
    });
  }
})();
</script>
</body>
</html>
